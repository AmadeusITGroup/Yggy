name: Bug report
description: Something in Yggy behaves differently from what you expected.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Bug reports are welcome and are triaged by the team — thank you for taking
        the time.

        Two things before you start:

        - **If this is a security vulnerability, close this form.** Report it
          privately by email to `opensource@amadeus.com` instead, as described in
          [SECURITY.md](https://github.com/AmadeusITGroup/Yggy/blob/main/SECURITY.md).
        - **If you already know the fix, describe it here** rather than opening a
          pull request. This repository is a read-only mirror of a private one, so
          a PR cannot be merged — but an explanation or a pasted diff can be
          applied internally, with credit.

        Not sure it is a bug? File it anyway and say so in the summary.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: What you expected to happen, and what happened instead.
      placeholder: |
        I expected …
        Instead, …
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description:
        The smallest set of steps that triggers it. A minimal descriptor or
        configuration that shows the problem is the most useful thing you can
        include.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Affected module
      description:
        Where you saw it. Pick "Not sure" if you cannot tell — that is a normal
        answer and not a problem.
      options:
        - Not sure
        - aud/libraries/lib-models
        - aud/libraries/lib-yaml-model
        - aud/libraries/lib-common
        - aud/libraries/lib-data-engine
        - aud/libraries/lib-graph-engine
        - aud/libraries/lib-graphql
        - aud/libraries/lib-backend-apis
        - aud/libraries/lib-aud-service
        - aud/libraries/lib-azure-nsg
        - aud/services/service-http-apis
        - aud/services/service-http-connectivity-engine
        - Build / tooling
        - Something else (describe below)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release you are on, or the commit SHA if you built from source.
      placeholder: "e.g. v1.0.0, or commit 4f2c1ab"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Needed for anything build- or run-related. The output of `java -version`
        and `mvn -version` covers most of it, plus your operating system.
      value: |
        Java:
        Maven:
        OS:
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or stack trace
      description:
        As text rather than a screenshot, so it is searchable and we can copy from
        it. Trim it to the relevant part.
      render: shell
    validations:
      required: false

  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested fix (optional)
      description:
        If you have traced the cause or have a patch, put it here — prose or a
        diff, either is useful.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label:
            I searched the existing issues and this has not already been reported.
          required: true
        - label:
            This is not a security vulnerability. (If it is, report it privately
            by email instead.)
          required: true
