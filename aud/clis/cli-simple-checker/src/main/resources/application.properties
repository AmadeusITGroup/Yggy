# Quarkus Configuration File
quarkus.banner.enabled=false
quarkus.devservices.enabled=false
quarkus.log.category."io.quarkus".level=OFF
quarkus.log.category."com.azure.core".level=OFF
quarkus.hibernate-orm.enabled=false

# avoid quarkus starting its http server
quarkus.http.host-enabled=false
quarkus.http.insecure-requests=disabled
quarkus.vertx.eventbus.key-certificate-pem.enabled=false
quarkus.management.enabled=false
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=false


# Variables
aud-model.default-scopes-bitbucket-project-key=AUD
aud-model.default-scopes-bitbucket-url-prefix=https://example.com/hello-
aud-model.enable-warnings=false
aud-model.keep-duplicates=true

## logging
quarkus.log.level=INFO
quarkus.log.console.enabled=true
quarkus.log.console.format=%d{yyy-MM-dd HH:mm:ss}Z %-5p %m (%F:%L)%n
quarkus.console.color=true

aud-scopes.associate-scope-with-requirements=false


