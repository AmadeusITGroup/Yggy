## General Quarkus Configuration
quarkus.application.name=aud-api-service

quarkus.banner.enabled=false
quarkus.datasource.devservices.enabled=false
quarkus.devservices.enabled=false

quarkus.index-dependency.aud.group-id=com.amadeus.aud.libraries
quarkus.index-dependency.guava.group-id=com.google.guava

## Logging Quarkus Configuration
%test.quarkus.log.console.json.enabled=false
%dev.quarkus.log.console.json.enabled=false
quarkus.http.access-log.enabled=true
quarkus.log.file.enabled=false
quarkus.log.console.format=%d{yyy-MM-dd HH:mm:ss}Z %-5p %m (%F:%L)%n

quarkus.console.color=true
quarkus.log.level=INFO
%dev.quarkus.log.level=INFO
%dev.quarkus.log.category."io.quarkus".level=INFO

quarkus.log.category."com.amadeus.aud".level=INFO
%dev.quarkus.log.category."com.amadeus.aud".level=DEBUG
%dev.quarkus.log.category."com.amadeus.aud".min-level=DEBUG
%test.quarkus.log.category."com.amadeus.aud".level=DEBUG

quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=INFO
%dev.quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=TRACE
%dev.quarkus.log.category."org.jboss.resteasy.reactive.client.logging".min-level=TRACE
%test.quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=INFO

quarkus.log.category."io.quarkus.oidc".level=DEBUG
%test.quarkus.log.category."io.quarkus.oidc".level=INFO

## Http Settings
quarkus.http.enable-compression=true

# This config is to ensure that we do not log Exceptions that are thrown on purpose to
#   skip caching the results using caffeine.
# Know that you need to log them explicitly if they are not expected.
quarkus.log.category."com.github.benmanes.caffeine.cache.LocalAsyncCache".level=ERROR

## Quarkus Metrics Configuration
quarkus.management.enabled=true
%dev.quarkus.management.enabled=false
%test.quarkus.management.enabled=false
quarkus.micrometer.export.prometheus.path=/metrics

## Rest Client Quarkus Configuration
quarkus.rest-client.logging.scope=request-response
quarkus.rest-client.logging.body-limit=500

quarkus.rest-client."aud-remote".url=https://api.localhost

## OIDC Client Quarkus Configuration
quarkus.oidc.auth-server-url=https://login.microsoftonline.com/${azure.tenant-id}/v2.0
quarkus.oidc-client.refresh-token-time-skew=60
quarkus.oidc-client.early-tokens-acquisition=false

# Graph Engine Microservice Client
quarkus.rest-client."graph-engine".url=${AUD_CONNECTIVITY_GRAPH_ENGINE_URL:http://localhost:8081}
quarkus.rest-client."graph-engine".connect-timeout=5000
quarkus.rest-client."graph-engine".read-timeout=600000

quarkus.oidc-client."graph-engine".connection-retry-count=10
quarkus.oidc-client."graph-engine".connection-timeout=60S
quarkus.oidc-client."graph-engine".auth-server-url=https://login.microsoftonline.com/${azure.tenant-id}/v2.0
quarkus.oidc-client."graph-engine".grant.type=client
quarkus.oidc-client."graph-engine".client-id=${AZURE_CLIENT_ID}
quarkus.oidc-client."graph-engine".credentials.secret=${AZURE_CLIENT_SECRET}
quarkus.oidc-client."graph-engine".scopes=${AUD_CONNECTIVITY_ENGINE_SCOPES:api://example-id/.default}

## SmallRye Quarkus OpenAPI Configuration
quarkus.smallrye-openapi.enabled=true
quarkus.smallrye-openapi.management.enabled=false
quarkus.smallrye-openapi.path=/openapi
mp.openapi.extensions.smallrye.operationIdStrategy=METHOD
quarkus.smallrye-openapi.auto-add-security=false

## Swagger UI Quarkus Configuration
#quarkus.swagger-ui.oauth2-redirect-url=http://localhost:8080/q/swagger-ui/oauth2-redirect.html
quarkus.swagger-ui.oauth-client-id=${aud-api.swagger-ui.oauth-client-id:example-client-id}
quarkus.swagger-ui.oauth-app-name=${aud-api.swagger-ui.oauth-app-name:aud-api-swagger-dev}
quarkus.swagger-ui.oauth-use-pkce-with-authorization-code-grant=true
quarkus.swagger-ui.persist-authorization=false
# Variable oauth-scopes done at build time, need an hardcoded value for the swagger
quarkus.swagger-ui.oauth-scopes=api://${AZURE_CLIENT_ID:example-client-id}/user_impersonation
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.title="AUD API Service"
quarkus.swagger-ui.path=/openapi-ui
quarkus.swagger-ui.theme=material
quarkus.swagger-ui.scripts=/swagger-download-threshold.js
quarkus.swagger-ui.response-interceptor=downloadLargeResponseInterceptor

## OIDC Quarkus Configuration
quarkus.oidc.application-type=service
quarkus.oidc.health.enabled=true
quarkus.oidc.devui.grant.type=client
quarkus.oidc.roles.role-claim-path="roles"
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.discovery-enabled=true
quarkus.oidc.resolve-tenants-with-issuer=true

quarkus.oidc."aud".auth-server-url=https://login.microsoftonline.com/${azure.tenant-id}/v2.0
quarkus.oidc."aud".client-id=${AZURE_CLIENT_ID}

###########################################################################################################
# LOCAL DEVELOPMENT DEFAULTS - NOT SAFE FOR A NETWORK-EXPOSED DEPLOYMENT.
#
# OIDC is disabled and every path is matched by a `permit` policy so the service
# can be started with no identity provider and no credentials (see
# "Running locally against a data directory" in aud/README.md).
#
# Any deployment MUST override these, for example:
#   quarkus.oidc.enabled=true
#   quarkus.http.auth.permission.protected.policy=authenticated
#
# Note that `permitted.paths` below is anonymous by design. Two entries need
# attention before this service is exposed to an untrusted network:
#
#   /graphdump  returns the whole connectivity graph.
#   /metrics    exposes operational metrics, including the identities of calling
#               service principals. Under the default profile
#               `quarkus.management.enabled=true` moves Prometheus to the
#               management port, so this entry only takes effect in dev and test -
#               which is a reason to delete it rather than to rely on it.
#
# Restrict or remove both before exposing this service.
###########################################################################################################
quarkus.oidc.enabled=false

## Quarkus HTTP Auth
quarkus.http.auth.permission.protected.paths=/*
quarkus.http.auth.permission.protected.policy=permit
quarkus.http.auth.permission.permitted.paths=/version,/version/loaded,/graphdump,/q/health/*,/metrics
quarkus.http.auth.permission.permitted.policy=permit
quarkus.http.auth.permission.permitted.methods=GET,HEAD

## Cache settings
quarkus.cache.caffeine.expire-after-write=10m
# 4 versions need ~12Gb, 8 versions need ~16Gb
quarkus.cache.caffeine."version-cache".maximum-size=8
quarkus.cache.caffeine."version-cache".expire-after-write=24h
quarkus.cache.caffeine."graph-cache".expire-after-write=24h

## Azure Storage Account
quarkus.azure.storage.blob.enabled=true
quarkus.azure.storage.blob.health.enabled=false
quarkus.azure.storage.blob.devservices.enabled=false
quarkus.azure.storage.blob.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:https://storage-account.blob.core.windows.net/}

# Database Backend
graph.database.type=inmemory

## OpenTelemetry Quarkus Configuration
%dev.quarkus.otel.sdk.disabled=true
%dev.quarkus.otel.traces.sampler=traceidratio
%dev.quarkus.otel.traces.sampler.arg=0.0d
quarkus.otel.security-events.enabled=true
quarkus.otel.exporter.otlp.traces.endpoint=http://otel-collector-main.localhost:4317
quarkus.otel.service.name=aud

## AUD Custom Configuration
## Token Tracing: log claims of inbound bearer tokens without enforcing them
aud.security.tracing.enabled=true
%test.aud.security.tracing.enabled=true
quarkus.log.category."com.amadeus.aud.services.apis.security".level=INFO
%dev.quarkus.log.category."com.amadeus.aud.services.apis.security".level=DEBUG

aud-requirements.dump.enabled=false
%dev.aud-requirements.dump.base-path=./tmp

aud-graph.caffeine-cache.maximum-graph-cache-size=${quarkus.cache.caffeine."version-cache".maximum-size:8}
%dev.aud-graph.caffeine-cache.maximum-graph-cache-size=4
aud-graph.caffeine-cache.enable-metrics=true
aud-graph.file-cache.enabled=false
%dev.aud-graph.file-cache.base-path=./tmp
aud.graph.init.ready-timeout=10M
aud.graph.init.ready-poll-interval=5S

aud-model.default-scopes-bitbucket-project-key=AUD
aud-model.yaml-validation.enable-on-the-fly-fixes=true
aud-model.yaml-validation.enable-warning=true
aud-model.caffeine-cache.maximum-graph-cache-size=${quarkus.cache.caffeine."version-cache".maximum-size:8}
%dev.aud-model.caffeine-cache.maximum-graph-cache-size=4
aud-model.caffeine-cache.enable-metrics=true

aud-api.version=1.0.0
aud-api.platform=${paas.info.name:local}
aud-api.bundle-ranges."DEMO".cidr=10.0.0.0/16
aud-common.pci-phases=PCI-1,PCI-2
quarkus.http.header."Server".value=aud-api/${aud-api.version} (platform=${paas.info.name:local})

quarkus.smallrye-graphql.root-path=/v2/graphql
quarkus.smallrye-graphql.ui.always-include=true
quarkus.smallrye-graphql.ui.root-path=/v2/graphql-ui

## GraphQL protection – prevent expensive queries from blocking the API
# Reject queries nested deeper than N levels (uses graphql-java MaxQueryDepthInstrumentation).
# Unset by default — set to a value to enable. Tune based on your deepest legitimate query.
quarkus.smallrye-graphql.instrumentation-query-depth=15
# Reject queries whose field-count complexity score exceeds N (uses MaxQueryComplexityInstrumentation).
# Unset by default — set to a value to enable. Tune based on your heaviest legitimate query.
quarkus.smallrye-graphql.instrumentation-query-complexity=100

aud-scopes.enabled=false
aud-scopes.associate-scope-with-requirements=false
aud-scopes.max-load-duration=1200s

# Load from local file
# make sure quarkus.azure.storage.blob.enabled is set to false if you use-local-data
aud-data.local-file.use-local-data=true
aud-data.local-file.local-data-directory=/tmp/yggy-data