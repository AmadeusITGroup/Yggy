openapi: "3.1.1"
info:
  version: 1.0.0
  description: Amadeus Unified Descriptor API specification
  title: AUD
  license:
    name: Apache 2.0
    identifier: Apache-2.0
servers:
  - url: /
    description: Current Environment
  - url: http://localhost:8080
    description: Local Dev Instance
components:
  responses:
    UnauthorizedError:
      description: Unauthorized Error
      headers:
        WWW-Authenticate:
          description: The authentication method that should be used to gain access
          schema:
            type: string
            default: 'Bearer realm="Access to AUD API"'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 401
            message: User is not authorized to access this resource
    ForbiddenError:
      description: Forbidden Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 403
            message: User does not have permission to access this resource
    NotFoundError:
      description: Not Found Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 404
            message: The resource you have requested does not exist.
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 500
            message: Internal server error
  schemas:
    v1.Metadata:
      description: Metadata to identify a resource - Mandatory part of all the AUD
        objects
      properties:
        scope:
          description: "The scope of the resource (RBAC), tool or application and\
            \ a place where they are defined"
          type: string
        name:
          description: "The name of the resource, must be unique."
          type: string
        providerSpecific:
          description: Json including all properties that are provider specific.
          type: string
        labels:
          additionalProperties:
            type: string
          description: Labels to further describe the resource.
          type: object
        comment:
          description: Any comment related to this object.
          type: string
      required:
        - name
        - scope
      type: object
      x-parent: true
    v1.MetadataInstance:
      allOf:
        - $ref: "#/components/schemas/v1Metadata"
        - properties:
            landingzone:
              description: "The landing zone where this instance will be created. It's\
              \ an environment or foundation for hosting your workload and application,\
              \ basically Hub or Spoke."
              type: string
            creation_date:
              description: Instance creation date.
              format: date-time
              type: string
            update_date:
              description: Instance update date.
              format: date-time
              type: string
            creation_version:
              description: Instance creation requirements version.
              type: string
            update_version:
              description: Instance update requirements version.
              type: string
          required:
            - landingzone
          type: object
      description: Metadata to identify a resource instance.
    v1.MetadataConfig:
      allOf:
        - $ref: "#/components/schemas/v1Metadata"
        - properties:
            config_host:
              description: The instance hosting the configuration
              type: string
            config_host_landingzone:
              description: The landingzone of the instance hosting the configuration
              type: string
          required:
            - config_host
            - config_host_landingzone
          type: object
      description: Metadata to identify a resource config.
    v1.Base:
      description: Base for model definition objects.
      properties:
        apiVersion:
          description: Version of the API to user.
          type: string
        kind:
          description: Kind of Object.
          type: string
        metadata:
          $ref: "#/components/schemas/v1Metadata"
      required:
        - apiVersion
        - kind
        - metadata
      type: object
      x-implements:
        - com.amadeus.aud.libraries.yaml.models.ModelElement
      x-parent: true
    v1.BaseInstance:
      allOf:
        - $ref: "#/components/schemas/v1Base"
        - properties:
            metadata:
              $ref: "#/components/schemas/v1MetadataInstance"
          required:
            - metadata
          type: object
      description: Base for instance definition objects.
      x-parent: true
    v1.BaseConfig:
      allOf:
        - $ref: "#/components/schemas/v1Base"
        - properties:
            metadata:
              $ref: "#/components/schemas/v1MetadataConfig"
          required:
            - metadata
          type: object
      description: Base for config definition objects.
    v1.Role:
      allOf:
        - $ref: "#/components/schemas/v1Base"
        - type: object
      description: Role
    v1.Roles:
      description: List of Roles
      items:
        $ref: "#/components/schemas/v1Role"
      type: array
    v1.ScopeSpec:
      description: Scope specification
      properties:
        is_deleted:
          description: scope deleted Boolean
          type: boolean
        deletion_date:
          type: string
        assigneeGroup:
          description: WinAProach Assignee Group
          type: string
        nanoID:
          description: NanoID
          type: string
        adminGroups:
          description: MUCMSPDOM Admin Groups
          items:
            type: string
          type: array
        roles:
          description: List of roles authorized in the scope
          items:
            type: string
          type: array
        governance_activation_level:
          description: Governance activation level for the scope. Values 1 to 4. 1->
            Default.  4-> Connectivity Enabled
          type: integer
        owners:
          description: Owner of admin group
          items:
            type: string
          type: array
        members:
          description: Members of admin group
          items:
            $ref: "#/components/schemas/v1_ScopeSpec_members_inner"
          type: array
      type: object
    v1.Scope:
      allOf:
        - $ref: "#/components/schemas/v1.Base"
        - properties:
            spec:
              $ref: "#/components/schemas/v1.ScopeSpec"
          type: object
      description: Scope is your tool or application and a place where they are defined
    v1.Scopes:
      description: List of Scopes
      items:
        $ref: "#/components/schemas/v1.Scope"
      type: array
    v1.ScopeReleaseNote:
      allOf:
        - $ref: "#/components/schemas/v1.Base"
        - properties:
            spec:
              $ref: "#/components/schemas/v1.ScopeReleaseNoteSpec"
          type: object
      description: ScopeReleaseNote
    v1.ScopeVersionMapping:
      allOf:
        - $ref: "#/components/schemas/v1.Base"
        - properties:
            spec:
              $ref: "#/components/schemas/v1.ScopeVersionMappingSpec"
          type: object
      description: ScopeVersionMapping
    v1.Commit:
      properties:
        commitid:
          description: commit id in the repo
          type: string
        message:
          description: associated commit message
          type: string
      type: object
    v1.Device:
      properties:
        device_type:
          description: type of the device
          type: string
        name:
          description: name of the device
          type: string
      type: object
    v1.ScopeReleaseNoteSpec:
      properties:
        version_datetime:
          description: Timestamp of scope version creation
          example: 2025-02-18T15:31:47.430Z
          type: string
        scope_version:
          description: Version of the scope
          example: 1.0.116
          type: string
        commits:
          description: List of commits
          items:
            $ref: "#/components/schemas/v1.Commit"
          type: array
        prs:
          description: List of PRs
          items:
            type: string
          type: array
        impacted_devices:
          description: List of devices
          items:
            $ref: "#/components/schemas/v1.Device"
          type: array
      type: object
    v1.ScopeReleaseNotes:
      description: List of ScopeReleaseNote
      items:
        $ref: "#/components/schemas/v1.ScopeReleaseNote"
      type: array
    v1.ScopeVersionMappingSpec:
      properties:
        version_datetime:
          description: Timestamp of scope version creation
          type: string
        scope_version:
          description: Version of the scope
          type: string
        aud_version:
          description: Version of the scope
          type: string
      type: object
    v1.ScopeVersionMappings:
      description: List of ScopeVersionMapping
      items:
        $ref: "#/components/schemas/v1.ScopeVersionMapping"
      type: array
    v1.Namespace:
      allOf:
        - $ref: "#/components/schemas/v1.Base"
        - properties:
            spec:
              $ref: "#/components/schemas/v1.NamespaceSpec"
          type: object
      description: Namespace used in openshift for a given scope.
    v1.NamespaceSpec:
      properties:
        is_shared:
          default: false
          description: is Namespace authorized in other scopes ?
          type: boolean
        authorized_scopes:
          description: List of scopes allowed to use this namespace
          items:
            type: string
          type: array
      type: object
    v1.Namespaces:
      description: List of namespaces
      items:
        $ref: "#/components/schemas/v1.Namespace"
      type: array
    v1.Provider:
      allOf:
        - $ref: "#/components/schemas/v1.Base"
      description: "Cloud provider e.g Microsoft - Azure, Amazon - AWS, Google - GCP,\
        \ Amadeus."
    v1.Providers:
      description: List of providers
      items:
        $ref: "#/components/schemas/v1.Provider"
      type: array
    DeprecatedStatus:
      default: None
      description: "The status reported to other users - None (not deprecated), Warning\
        \ (informational, not blocking) or Error (blocking the merge of PR)."
      enum:
        - None
        - Warning
        - Error
      nullable: true
      type: string
    v1.ServicetagSpec:
      properties:
        any_needed_in_nsg:
          default: false
          description: is Namespace authorized in other scopes ?
          type: boolean
      type: object
    v1.Servicetag:
      allOf:
        - $ref: "#/components/schemas/v1.Base"
        - properties:
            spec:
              $ref: "#/components/schemas/v1.ServicetagSpec"
          required:
            - spec
          type: object
      description: Service tag.
    v1.Servicetags:
      description: List of servicetags
      items:
        $ref: "#/components/schemas/v1.Servicetag"
      type: array
    v1.Continent:
      allOf:
        - $ref: "#/components/schemas/v1.Base"
      description: "where it is located e.g. Asia, Europe, America, Worldwide which\
        \ could contain one or more regions"
    v1.Continents:
      description: List of Continent
      items:
        $ref: "#/components/schemas/v1.Continent"
      type: array
    v1.RegionSpec:
      properties:
        provider:
          description: Name of the provider.
          type: string
        continent:
          description: Name of continent.
          type: string
      required:
        - continent
        - provider
      type: object
    v1.Region:
      allOf:
        - $ref: "#/components/schemas/v1.Base"
        - properties:
            spec:
              $ref: "#/components/schemas/v1.RegionSpec"
          required:
            - spec
          type: object
      description: Describe a region
    v1.Regions:
      description: List of Regions.
      items:
        $ref: "#/components/schemas/v1.Region"
      type: array
    v1.OutboundSNATSpec:
      properties:
        translatedip:
          description: IP used for SNAT result
          type: string
        macrophase:
          description: Name of macrophase.
          type: string
        continent:
          description: Name of continent.
          type: string
        zonetype:
          description: Name of securityzone.
          type: string
        components:
          description: List of component
          items:
            type: string
          type: array
        component_instances:
          description: List of component_instance
          items:
            type: string
          type: array
        cidrs:
          description: List of vnet
          items:
            type: string
          type: array
        destination_cidrs:
          description: List of vnet
          items:
            type: string
          type: array
        destination_fqdns:
          description: List of fqdn
          items:
            type: string
          type: array
        protocol:
          description: protocol
          enum:
            - Any
            - Tcp
            - Udp
          type: string
      required:
        - continent
        - macrophase
        - protocol
        - translatedip
        - zonetype
      type: object
    v1.OutboundSNAT:
      allOf:
        - $ref: "#/components/schemas/v1.Base"
        - properties:
            spec:
              $ref: "#/components/schemas/v1.OutboundSNATSpec"
          required:
            - spec
          type: object
      description: Describe an Outbound setting
    v1.OutboundSNATs:
      description: List of outbound settings.
      items:
        $ref: "#/components/schemas/v1.OutboundSNAT"
      type: array
    v1.TargetType:
      allOf:
        - $ref: "#/components/schemas/v1.Base"
      description: "The Target Type e.g. Regional Hub, Satellite, Satellite Native."
    v1.TargetTypes:
      description: List of Target Types
      items:
        $ref: "#/components/schemas/v1.TargetType"
      type: array
    v1.TargetSpec:
      properties:
        provider:
          description: Name of provider
          type: string
        cidrs:
          description: List of vnet
          items:
            type: string
          type: array
        isCloud:
          default: false
          description: is it a cloud target?
          type: boolean
        isAmadeus:
          default: false
          description: is is managed by Amadeus?
          type: boolean
        isAudManaged:
          default: false
          description: is it AUD managed?
          type: boolean
        enableOfficeConnectivity:
          default: false
          description: is Office Connectivity enabled?
          type: boolean
        enableVnetToVnet:
          default: false
          description: is Vnet to Vnet enabled?
          type: boolean
        enableJumpserverConnectivity:
          default: false
          description: is Jumpserver Connectivity enabled?
          type: boolean
        macroPhase:
          description: Name of the macro phase
          type: string
        continent:
          description: Name of the continent
          type: string
        targettype:
          description: Type of the Target
          type: string
        popPrimary:
          description: Name of the POP target used as primary
          type: string
        popSecondary:
          description: Name of the POP target used as backup
          type: string
      required:
        - macroPhase
        - provider
      type: object
    v1.Target:
      allOf:
        - $ref: "#/components/schemas/v1.Base"
        - properties:
            spec:
              $ref: "#/components/schemas/v1.TargetSpec"
          required:
            - spec
          type: object
      description: "The target name, target is the environment you need to build.\
        \ 1 target represent 1 or multiple Hub & multiple spokes with the same region\
        \ and macro phase."
    v1.Targets:
      description: List of Targets
      items:
        $ref: "#/components/schemas/v1.Target"
      type: array
    v1.LandingzoneType:
      allOf:
        - $ref: "#/components/schemas/v1.Base"
      description: "The Landing Zone Type e.g. CloudEdge, Default Azure HUB, Default\
        \ Azure Spoke etc."
    v1.LandingzoneTypes:
      description: List of Landing Zone Types
      items:
        $ref: "#/components/schemas/v1.LandingzoneType"
      type: array
    v1.LandingzoneFunctionalType:
      allOf:
        - $ref: "#/components/schemas/v1.Base"
      description: "The Landing Zone FunctionalType e.g. Tooling, Shopping, DCS etc."
    v1.LandingzoneFunctionalTypes:
      description: List of Landing Zone Functional Types
      items:
        $ref: "#/components/schemas/v1.LandingzoneFunctionalType"
      type: array
    v1.LandingZoneSpec:
      properties:
        target:
          description: Name of target
          type: string
        region:
          description: Name of the region
          type: string
        macrophase:
          description: Name of the macrophase
          type: string
        cidrs:
          description: List of vnet
          items:
            type: string
          type: array
        landingzonetype:
          description: Type of the Landing Zone
          type: string
        functionaltypes:
          description: Functional types of the Landing Zone
          items:
            type: string
          type: array
      required:
        - cidrs
        - landingzonetype
        - region
        - target
      type: object
    v1.LandingZone:
      allOf:
        - $ref: "#/components/schemas/v1.Base"
        - properties:
            spec:
              $ref: "#/components/schemas/v1.LandingZoneSpec"
          required:
            - spec
          type: object
      description: "is an environment or foundation for hosting your workload and\
        \ application, basically Hub or Spoke."
    v1.LandingZones:
      description: List of Landing zones
      items:
        $ref: "#/components/schemas/v1.LandingZone"
      type: array
    v1.SubnetType:
      allOf:
        - $ref: "#/components/schemas/v1.Base"
      description: "this has to do with the workload owner of the specific subnet\
        \ e.g Oracle, SQL or Kafka."
    v1.SubnetTypes:
      description: List of Subnet Types.
      items:
        $ref: "#/components/schemas/v1.SubnetType"
      type: array
    v1.MacroPhaseSpec:
      description: MacroPhase specification
      properties:
        automation_order:
          description: Automation order in ascending order
          type: integer
      type: object
    v1.MacroPhase:
      allOf:
        - $ref: "#/components/schemas/v1.Base"
        - properties:
            spec:
              $ref: "#/components/schemas/v1.MacroPhaseSpec"
          type: object
      description: Definition of the MacroPhase
    v1.MacroPhases:
      description: List of Macro Phases
      items:
        $ref: "#/components/schemas/v1.MacroPhase"
      type: array
    v1.ConnectionSpec:
      description: Connection specification
      properties:
        sourceZoneType:
          description: Name of the source zone type
          type: string
        destinationZoneType:
          description: Name of destination Zone Type
          type: string
        control:
          description: "The value of the control, if permitted"
          enum:
            - green
            - amber
            - red
          type: string
        level:
          description: The protocol level check that needs to be implemented
          enum:
            - L7
            - L4
          type: string
        type:
          description: Is the connectivity internal or external to the target?
          enum:
            - Internal
            - External
          type: string
      required:
        - control
        - destinationZoneType
        - level
        - sourceZoneType
        - type
      type: object
    v1.Connection:
      allOf:
        - $ref: "#/components/schemas/v1.Base"
        - properties:
            spec:
              $ref: "#/components/schemas/v1.ConnectionSpec"
          required:
            - spec
          type: object
      description: Definition of a Conncetion. The connection between two security
        zone types - Filled by Security
    v1.Connections:
      description: List of connections
      items:
        $ref: "#/components/schemas/v1.Connection"
      type: array
    v1.MappingLandingzoneFunctionaltypeSpec:
      description: MappingLandingzoneFunctionaltype specification
      properties:
        landingzone:
          description: Name of the landingzone
          type: string
        functionaltype:
          description: Name of the functional type
          type: string
      required:
        - functionaltype
        - landingzone
      type: object
    v1.MappingLandingzoneFunctionaltype:
      allOf:
        - $ref: "#/components/schemas/v1.Base"
        - properties:
            spec:
              $ref: "#/components/schemas/v1.MappingLandingzoneFunctionaltypeSpec"
          required:
            - spec
          type: object
      description: Definition of a MappingLandingzoneFunctionaltype. Associate a functional
        type to a landingzone
    v1.MappingLandingzoneFunctionaltypes:
      description: List of MappingLandingzoneFunctionaltype
      items:
        $ref: "#/components/schemas/v1.MappingLandingzoneFunctionaltype"
      type: array
    v1.ConnectionPhaseSpec:
      description: Connection Phase specification
      properties:
        destinationPhase:
          description: Name of the destination macro-phase
          type: string
        control:
          description: "The value of the control, if permitted"
          enum:
            - green
            - amber
            - red
          type: string
        sourcePhase:
          description: Name of the source macro-phase
          type: string
      required:
        - control
        - destinationPhase
        - sourcePhase
      type: object
    v1.ConnectionPhase:
      allOf:
        - $ref: "#/components/schemas/v1.Base"
        - properties:
            spec:
              $ref: "#/components/schemas/v1.ConnectionPhaseSpec"
          required:
            - spec
          type: object
      description: Definition of a Conncetion Phase. The connection between two security
        macro phase - Filled by Security
    v1.ConnectionPhases:
      description: List of connection phases
      items:
        $ref: "#/components/schemas/v1.ConnectionPhase"
      type: array
    v1.BlockedPortSpec:
      description: Blocked port specification.
      properties:
        port:
          description: port number to block
          type: integer
        protocol:
          description: "The protocol e.g. TCP, UDP, Icmp."
          enum:
            - Tcp
            - Udp
            - Icmp
          type: string
      required:
        - port
        - protocol
      type: object
    v1.BlockedPort:
      allOf:
        - $ref: "#/components/schemas/v1.Base"
        - type: object
      description: Definition of BlockedPort
      properties:
        spec:
          $ref: "#/components/schemas/v1.BlockedPortSpec"
      required:
        - spec
    v1.BlockedPorts:
      description: List of BlockedPort
      items:
        $ref: "#/components/schemas/v1.BlockedPort"
      type: array
    v1.BlackListedURLSpec:
      description: Black list Url specification. Filled by Security
      properties:
        transportLayer:
          description: "The low level protocol e.g. TCP, UDP, Icmp."
          items:
            enum:
              - Tcp
              - Udp
              - Icmp
            type: string
          type: array
        fqdn:
          description: "Domain Name, optionally prefixed by *."
          type: string
        ports:
          description: The port information (list of port or port-range)
          items:
            type: string
          type: array
      required:
        - fqdn
        - ports
        - transportLayer
      type: object
    v1.BlackListedURL:
      allOf:
        - $ref: "#/components/schemas/v1.Base"
        - type: object
      description: Definition of BlackListedUrl
      properties:
        spec:
          $ref: "#/components/schemas/v1.BlackListedURLSpec"
      required:
        - spec
    v1.BlackListedUrls:
      description: List of BlackListedUrl
      items:
        $ref: "#/components/schemas/v1.BlackListedURL"
      type: array
    v1.BlackListedCIDRSpec:
      description: Black list cidr specification. Filled by Security
      properties:
        transportLayer:
          description: "The low level protocol e.g. TCP, UDP, Icmp."
          items:
            enum:
              - Tcp
              - Udp
              - Icmp
            type: string
          type: array
        cidr:
          description: CIDR
          type: string
        ports:
          description: The port information (list of port or port-range)
          items:
            type: string
          type: array
      required:
        - cidr
        - ports
        - transportLayer
      type: object
    v1.BlackListedCIDR:
      allOf:
        - $ref: "#/components/schemas/v1.Base"
        - type: object
      description: Definition of BlackListedCIDR
      properties:
        spec:
          $ref: "#/components/schemas/v1.BlackListedCIDRSpec"
      required:
        - spec
    v1.BlackListedCIDRs:
      description: List of BlackListedCIDR
      items:
        $ref: "#/components/schemas/v1.BlackListedCIDR"
      type: array
    v1.ApplicationPhaseSpec:
      description: ApplicationPhase specifciation
      properties:
        macroPhase:
          description: Name of macro Phase
          type: string
        isCustomerFacing:
          default: false
          description: is it Customer Facing?
          type: boolean
      required:
        - isCustomerFacing
      type: object
    v1.ApplicationPhase:
      allOf:
        - $ref: "#/components/schemas/v1.Base"
        - properties:
            spec:
              $ref: "#/components/schemas/v1.ApplicationPhaseSpec"
          required:
            - spec
          type: object
      description: "Definition of applicationPhase e.g UAT, PDT, PPT, MIG which relate\
        \ to MacroPhase"
    v1.ApplicationPhases:
      description: List of Application Phases
      items:
        $ref: "#/components/schemas/v1.ApplicationPhase"
      type: array
    v1.ZoneTypeSpec:
      description: ZoneType specification
      properties:
        isTechnical:
          default: false
          description: is this part of control or data plane?
          type: boolean
        isPaas:
          default: false
          description: is this used for ACS?
          type: boolean
        isReal:
          default: false
          description: does it contain an actual Amadeus workload?
          type: boolean
      required:
        - isTechnical
      type: object
    v1.ZoneType:
      allOf:
        - $ref: "#/components/schemas/v1.Base"
        - properties:
            spec:
              $ref: "#/components/schemas/v1.ZoneTypeSpec"
          required:
            - spec
          type: object
      description: Definition of the ZoneType - Filled by security
    v1.ZoneTypes:
      description: List of Zone Types
      items:
        $ref: "#/components/schemas/v1.ZoneType"
      type: array
    v1.ZoneInstanceSpec:
      description: ZoneInstance specification
      properties:
        zoneType:
          description: Name of Zone Type
          type: string
        isNSGNeeded:
          default: false
          description: Create or not an NSG on Azure (for technical zone only)
          type: boolean
