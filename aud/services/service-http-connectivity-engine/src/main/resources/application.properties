## General Quarkus Configuration
quarkus.application.name=graph-engine
quarkus.banner.enabled=false
quarkus.console.color=true

aud-api.version=1.0.0
aud-api.platform=${paas.info.name:local}

# =============================================================================
# HTTP
# =============================================================================
quarkus.http.port=8081
quarkus.http.access-log.enabled=true
quarkus.http.header."Server".value=aud-api/${aud-api.version} (platform=${paas.info.name:local})

# =============================================================================
# Class Loading & Indexing
# =============================================================================
quarkus.index-dependency.aud.group-id=com.amadeus.aud.libraries
quarkus.index-dependency.guava.group-id=com.google.guava

# Fix ClassCastException in dev mode: prevent lib-data-engine classes from being loaded
# by both the base and runtime classloaders when using --also-make multi-module builds.
# See: https://quarkus.io/guides/class-loading-reference#configuring-class-loading
%dev.quarkus.class-loading.parent-first-artifacts=com.amadeus.aud.libraries:lib-data-engine,com.amadeus.aud.libraries:lib-yaml-model

# =============================================================================
# Logging
# =============================================================================
quarkus.log.level=INFO
quarkus.log.category."com.amadeus.aud".level=INFO
quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=INFO
quarkus.log.category."io.quarkus.oidc".level=DEBUG
# Suppress intentional caffeine cache exceptions (thrown to skip caching results).
# Log them explicitly if they are not expected.
quarkus.log.category."com.github.benmanes.caffeine.cache.LocalAsyncCache".level=ERROR

# =============================================================================
# Metrics & Management
# =============================================================================
quarkus.management.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics

# =============================================================================
# OpenTelemetry
# =============================================================================
quarkus.otel.security-events.enabled=true
quarkus.otel.exporter.otlp.traces.endpoint=http://otel-endpoint.svc.cluster.local:4317

# =============================================================================
# REST Client
# =============================================================================
quarkus.rest-client.logging.scope=request-response
quarkus.rest-client.logging.body-limit=500

## SmallRye Quarkus OpenAPI Configuration
quarkus.smallrye-openapi.enabled=true
quarkus.smallrye-openapi.management.enabled=false
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.info-title=AUD API Connectivity Engine Service
quarkus.smallrye-openapi.info-version=1.0.1

## Swagger UI Quarkus Configuration
#quarkus.swagger-ui.oauth2-redirect-url=http://localhost:8081/q/swagger-ui/oauth2-redirect.html
quarkus.swagger-ui.oauth-client-id=${aud-api-connectivity-engine.swagger-ui.oauth-client-id:xxx}
quarkus.swagger-ui.oauth-app-name=${aud-api-connectivity-engine.swagger-ui.oauth-app-name:aud-api-connectivity-engine-swagger-dev}
quarkus.swagger-ui.oauth-use-pkce-with-authorization-code-grant=true
quarkus.swagger-ui.persist-authorization=false
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.title="AUD API Connectivity Engine Service"
quarkus.swagger-ui.path=/openapi-ui
quarkus.swagger-ui.theme=material

# =============================================================================
# OIDC Client
# =============================================================================
quarkus.oidc-client.refresh-token-time-skew=60
quarkus.oidc-client.early-tokens-acquisition=false
quarkus.keycloak.devservices.enabled=false

## OIDC Server - Inbound Bearer Token Validation
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=https://login.microsoftonline.com/${azure.tenant-id}/v2.0
quarkus.oidc.client-id=${AUD_CONNECTIVITY_ENGINE_CLIENT_ID}
quarkus.oidc.roles.role-claim-path="roles"
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.discovery-enabled=true
quarkus.oidc.resolve-tenants-with-issuer=true
quarkus.oidc.health.enabled=true

###########################################################################################################
# LOCAL DEVELOPMENT DEFAULTS - NOT SAFE FOR A NETWORK-EXPOSED DEPLOYMENT.
#
# The OIDC tenant is disabled by default. The `%dev` profile below also disables
# authorization so the service can be started with no identity provider and no credentials.
#
# Any deployment MUST enable the OIDC tenant, for example:
#   quarkus.oidc.tenant-enabled=true
###########################################################################################################
quarkus.oidc.tenant-enabled=false

## HTTP Auth Permissions
quarkus.http.auth.policy.read-policy.roles-allowed=ConnectivityEngine.Read
quarkus.http.auth.policy.write-policy.roles-allowed=ConnectivityEngine.Write
quarkus.http.auth.permission.read.paths=/api/v1/*
quarkus.http.auth.permission.read.methods=GET
quarkus.http.auth.permission.read.policy=read-policy
quarkus.http.auth.permission.read-by-node-ids.paths=/api/v1/versions/*/graph/edges/by-node-ids
quarkus.http.auth.permission.read-by-node-ids.methods=POST
quarkus.http.auth.permission.read-by-node-ids.policy=read-policy
quarkus.http.auth.permission.write.paths=/api/v1/*
quarkus.http.auth.permission.write.methods=POST
quarkus.http.auth.permission.write.policy=write-policy
quarkus.http.auth.permission.permitted.paths=/version,/q/health/*,/metrics,/openapi,/openapi-ui/*
quarkus.http.auth.permission.permitted.policy=permit
quarkus.http.auth.permission.permitted.methods=GET,HEAD

# =============================================================================
# Cache (Caffeine)
# =============================================================================
quarkus.cache.caffeine.expire-after-write=24h
# 4 versions need ~12Gb, 8 versions need ~16Gb
quarkus.cache.caffeine."version-cache".maximum-size=8
quarkus.cache.caffeine."graph-init-cache".maximum-size=12

# =============================================================================
# Azure Storage Account
# =============================================================================
quarkus.azure.storage.blob.enabled=true
quarkus.azure.storage.blob.health.enabled=true
quarkus.azure.storage.blob.devservices.enabled=false
quarkus.azure.storage.blob.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT}

# PostgreSQL Dev Services
quarkus.datasource.devservices.enabled=false

## Logging Quarkus Configuration
quarkus.log.file.enabled=false
quarkus.log.console.format=%d{yyy-MM-dd HH:mm:ss}Z %-5p %m (%F:%L)%n

## Http Settings
quarkus.http.enable-compression=true

aud-requirements.dump.enabled=false

aud-model.default-scopes-bitbucket-project-key=AUD
aud-model.yaml-validation.enable-on-the-fly-fixes=true
aud-model.yaml-validation.enable-warning=true
aud-model.caffeine-cache.maximum-graph-cache-size=${quarkus.cache.caffeine."version-cache".maximum-size:8}
aud-model.caffeine-cache.enable-metrics=true

# =============================================================================
# Database Backend
# =============================================================================
# Runtime property to select database backend: 'inmemory' (default) or 'postgres'
# Both backends are compiled into a single binary. The active backend is
# resolved at startup via @LookupIfProperty, so no rebuild is needed to switch.
# Prefer using QUARKUS_STORAGE=postgres|inmemory which sets this property
# AND activates the matching infrastructure (datasource, hibernate, logging…).
graph.database.type=inmemory

# Maximum number of graph versions to keep in the in-memory backend.
# When exceeded, the least recently accessed version is evicted.
# Set to 0 to disable eviction (unbounded — use with caution).
graph.inmemory.max-versions=5

# Suppress warning about JPA entities from lib-data-engine on classpath
# (used as POJOs, not managed by Hibernate in this service)
quarkus.log.category."io.quarkus.hibernate.orm.deployment.HibernateOrmProcessor".level=ERROR

# =============================================================================
# Profile: %dev
# =============================================================================
%dev.quarkus.log.level=INFO
%dev.quarkus.log.console.json.enabled=false
%dev.quarkus.log.category."io.quarkus".level=INFO
%dev.quarkus.log.category."com.amadeus.aud".level=DEBUG
%dev.quarkus.log.category."com.amadeus.aud".min-level=DEBUG
%dev.quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=TRACE
%dev.quarkus.log.category."org.jboss.resteasy.reactive.client.logging".min-level=TRACE
%dev.quarkus.management.enabled=false
%dev.quarkus.otel.enabled=false
%dev.quarkus.cache.caffeine."graph-init-cache".maximum-size=4
%dev.quarkus.hibernate-orm.schema-management.strategy=update
#%dev.quarkus.hibernate-orm.log.sql=true
%dev.aud-requirements.dump.base-path=./tmp
%dev.aud-model.caffeine-cache.maximum-graph-cache-size=2
%dev.quarkus.security.auth.enabled-in-dev-mode=false
%dev.quarkus.oidc.enabled=false
%dev.quarkus.oidc.tenant-enabled=false


# =============================================================================
# Profile: %test
# =============================================================================
quarkus.http.test-port=0
%test.quarkus.log.console.json.enabled=false
%test.quarkus.log.category."com.amadeus.aud".level=DEBUG
%test.quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=INFO
%test.quarkus.log.category."io.quarkus.oidc".level=INFO
%test.quarkus.management.enabled=false
%test.quarkus.scheduler.enabled=false
%test.quarkus.datasource.active=false
%test.quarkus.hibernate-orm.active=false
%test.quarkus.oidc.tenant-enabled=false
%test.azure.tenant-id=test-tenant
%test.aud-connectivity-engine.oidc.client-id=test-client-id

# =============================================================================
# Profile: %inmemory
# =============================================================================
# Usage: start with -Dquarkus.profile=inmemory or QUARKUS_STORAGE=inmemory
%inmemory.graph.database.type=inmemory
%inmemory.quarkus.datasource.active=false
%inmemory.quarkus.datasource.devservices.enabled=true
%inmemory.quarkus.hibernate-orm.active=false
%inmemory.quarkus.log.console.json.enabled=false
%inmemory.quarkus.log.level=INFO
%inmemory.quarkus.log.category."io.quarkus".level=INFO
%inmemory.quarkus.log.category."com.amadeus.aud".level=DEBUG
%inmemory.quarkus.log.category."com.amadeus.aud".min-level=DEBUG
%inmemory.quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=TRACE
%inmemory.quarkus.log.category."org.jboss.resteasy.reactive.client.logging".min-level=TRACE
%inmemory.quarkus.management.enabled=false
%inmemory.quarkus.otel.enabled=false
%inmemory.quarkus.cache.caffeine."graph-init-cache".maximum-size=4
%inmemory.aud-requirements.dump.base-path=./tmp
%inmemory.aud-model.caffeine-cache.maximum-graph-cache-size=2
%inmemory.quarkus.oidc.enabled=false
%inmemory.quarkus.oidc.tenant-enabled=false
%inmemory.quarkus.http.auth.permission.read.policy=permit
%inmemory.quarkus.http.auth.permission.write.policy=permit
%inmemory.quarkus.http.auth.permission.read-by-node-ids.policy=permit
