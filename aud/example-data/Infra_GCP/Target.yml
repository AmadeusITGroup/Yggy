---
apiVersion: v1
kind: Target
metadata:
  comment: Network Setup of GCP us-central1 hub
  name: gcp-us-central1-hub
  scope: Infra_GCP
spec:
  cidrs:
  - 172.16.0.0/16
  continent: America
  enableJumpserverConnectivity: true
  isCloud: true
  macroPhase: PRD
  provider: Google - GCP
  targettype: Google HUB
---
apiVersion: v1
kind: Target
metadata:
  comment: Network Setup of GCP spoke us-central1 (LZ3)
  name: gcp-us-central1-lz3
  scope: Infra_GCP
spec:
  continent: America
  cidrs:
  - 172.23.0.0/16
  enableJumpserverConnectivity: true
  enableOfficeConnectivity: true
  enableVnetToVnet: true
  isCloud: true
  macroPhase: RND
  provider: Google - GCP
  targettype: Google Spoke
