## Hibernate settings
quarkus.hibernate-orm.active=false
quarkus.hibernate-orm.enabled=false

## Datasource settings
quarkus.datasource.devservices.enabled=false

## Azure Storage Account
quarkus.azure.storage.blob.devservices.enabled=false
quarkus.azure.storage.blob.enabled=true
quarkus.azure.storage.blob.health.enabled=true
quarkus.azure.storage.blob.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:https://storage-account.blob.core.windows.net/}

#AudDataConfig
aud-data.cloud-storage.data-container-name=aud-data
aud-data.cloud-storage.requirements-container-name=aud-data
aud-data.cloud-storage.version-container-name=aud-version
aud-data.cloud-storage.pr-container-name=pr-diff
